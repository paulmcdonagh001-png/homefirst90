<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>HomeFirst90 Funnel</title>
<style>
:root{--g:#153f33;--m:#61706a;--p:#f5f5f0;--c:#fff;--l:#dfe5e1;--ink:#17201d}
*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}.w{max-width:1100px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:16px;align-items:end;flex-wrap:wrap}.brand{font-size:28px;font-weight:950}.muted{color:var(--m)}select,button{border:1px solid var(--l);background:#fff;border-radius:10px;padding:10px 12px;font:inherit}button{background:var(--g);color:#fff;font-weight:900;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.card{background:#fff;border:1px solid var(--l);border-radius:18px;padding:17px}.card span{display:block;color:var(--m);font-size:12px;font-weight:800}.card b{display:block;font-size:30px;margin:4px 0}.card small{color:var(--m)}.section{background:#fff;border:1px solid var(--l);border-radius:18px;padding:18px;margin-top:14px}.row{display:grid;grid-template-columns:1fr 100px 140px 140px;gap:10px;padding:10px 0;border-top:1px solid var(--l)}.row:first-child{border-top:0}.head{font-size:12px;color:var(--m);font-weight:900}.error{background:#fff0ee;padding:14px;border-radius:12px;margin-top:14px}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr 70px}.row>*:nth-child(n+3){display:none}}@media(max-width:480px){.grid{grid-template-columns:1fr}.w{padding:12px}}
</style>
</head>
<body><main class="w">
<div class="top"><div><div class="brand">HomeFirst90 Funnel</div><div class="muted">Visitors → tools → saved homes → captured moves → checkout → purchase</div></div>
<div><select id="days"><option value="7">7 days</option><option value="30" selected>30 days</option><option value="90">90 days</option><option value="365">365 days</option></select> <button id="refresh">Refresh</button></div></div>
<div id="status" class="muted" style="margin-top:10px">Loading…</div>
<section id="cards" class="grid"></section>
<section class="section"><h2 style="margin-top:0">Founding Tester progress</h2><div id="testerStatus" class="muted">Loading tester status…</div></section>
<section class="section"><h2 style="margin-top:0">Full funnel</h2><div class="row head"><div>Stage</div><div>Count</div><div>From previous</div><div>From visitors</div></div><div id="rows"></div></section>
<section class="section"><h2 style="margin-top:0">Visitor sources</h2><div id="sources"></div></section>
</main>
<script>
const API="https://homefirst90-api.onrender.com";
const labels={visitors:"Visitors",tool_starts:"Tool starts",tool_completions:"Tool completions",homes_saved:"Homes saved",emails_captured:"Moves/emails captured",complete_views:"Complete page views",checkout_starts:"Checkout starts",purchases:"Purchases"};
const pct=v=>v==null?"—":v+"%";
async function loadTester(){
 try{
  const r=await fetch(API+"/api/tester-status");
  const d=await r.json(); if(!r.ok)throw new Error();
  document.querySelector("#testerStatus").innerHTML='<b>'+d.used+' / '+d.limit+'</b> places used · <b>'+d.remaining+'</b> remaining · <b>'+d.feedback_received+'</b> feedback responses · <b>'+d.quotable_feedback+'</b> permitted testimonials';
 }catch(e){document.querySelector("#testerStatus").textContent="Tester status unavailable."}
}
async function load(){
 const days=document.querySelector("#days").value;
 const status=document.querySelector("#status"); status.textContent="Loading…";
 try{
  const r=await fetch(API+"/api/funnel?days="+encodeURIComponent(days));
  const d=await r.json(); if(!r.ok)throw new Error(d.error||"Could not load funnel.");
  status.textContent="Last refreshed "+new Date(d.generated_at).toLocaleString()+" · "+d.days+" day window";
  document.querySelector("#cards").innerHTML=d.stages.map(s=>'<div class="card"><span>'+labels[s.key]+'</span><b>'+s.count+'</b><small>'+pct(s.from_visitors_pct)+' of visitors</small></div>').join("");
  document.querySelector("#rows").innerHTML=d.stages.map(s=>'<div class="row"><div><b>'+labels[s.key]+'</b></div><div>'+s.count+'</div><div>'+pct(s.from_previous_pct)+'</div><div>'+pct(s.from_visitors_pct)+'</div></div>').join("");
  document.querySelector("#sources").innerHTML=d.sources.length?d.sources.map(s=>'<div class="row"><div><b>'+s.source+'</b></div><div>'+s.visitors+'</div><div></div><div></div></div>').join(""):'<div class="muted">No visitor-source data yet.</div>';
 }catch(e){status.innerHTML='<div class="error">'+e.message+'</div>'}
}
document.querySelector("#refresh").addEventListener("click",load);
document.querySelector("#days").addEventListener("change",load);
load();loadTester();
</script></body></html>
