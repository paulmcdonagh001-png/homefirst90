<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>HomeFirst90 Feedback Review</title><style>
:root{--g:#153f33;--m:#61706a;--p:#f5f5f0;--l:#dfe5e1;--ink:#17201d}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}.w{max-width:1100px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:12px;align-items:end;flex-wrap:wrap}.brand{font-size:28px;font-weight:950}.muted{color:var(--m)}.login,.summary,.item{background:#fff;border:1px solid var(--l);border-radius:18px;padding:18px;margin-top:14px}.login input{padding:11px;border:1px solid #cbd4cf;border-radius:10px;min-width:280px}.btn{border:0;background:var(--g);color:#fff;border-radius:10px;padding:11px 14px;font-weight:900;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.stat{background:#fff;border:1px solid var(--l);border-radius:16px;padding:15px}.stat span{display:block;color:var(--m);font-size:12px}.stat b{font-size:27px}.quote{background:#edf4f0;border-radius:12px;padding:12px;margin-top:10px}.bad{background:#fff3ef;border-radius:12px;padding:12px;margin-top:10px}.meta{font-size:12px;color:var(--m);display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none!important}@media(max-width:760px){.cards{grid-template-columns:1fr 1fr}}@media(max-width:480px){.cards{grid-template-columns:1fr}.w{padding:12px}.login input{min-width:0;width:100%;margin-bottom:8px}}
</style></head><body><main class="w"><div class="top"><div><div class="brand">HomeFirst90 Feedback</div><div class="muted">Private Founding Tester review</div></div></div>
<section id="login" class="login"><b>Review key</b><p class="muted">Enter the private feedback review key.</p><input id="key" type="password" autocomplete="off"> <button class="btn" id="load">Open feedback</button><div id="msg" class="muted" style="margin-top:8px"></div></section>
<div id="app" class="hidden"><section id="cards" class="cards"></section><section class="summary"><h2 style="margin-top:0">Founding Tester sign-ups</h2><div id="applications"></div></section><section class="summary"><h2 style="margin-top:0">Tester responses</h2><div id="items"></div></section></div>
</main><script>
const API="https://homefirst90-api.onrender.com";
const esc=s=>String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
async function load(){const key=document.querySelector("#key").value.trim(),msg=document.querySelector("#msg");msg.textContent="Loading…";try{const r=await fetch(API+"/api/feedback-review",{headers:{"X-Feedback-Key":key}});const d=await r.json();if(!r.ok)throw new Error("Incorrect review key.");sessionStorage.setItem("hf90-feedback-key",key);render(d.items||[],d.applications||[]);document.querySelector("#login").classList.add("hidden");document.querySelector("#app").classList.remove("hidden")}catch(e){msg.textContent=e.message}}
function render(items,applications){const ratings=items.filter(x=>x.rating),avg=ratings.length?(ratings.reduce((s,x)=>s+x.rating,0)/ratings.length).toFixed(1):"—",yes=items.filter(x=>x.would_pay==="yes").length,maybe=items.filter(x=>x.would_pay==="maybe").length,quotes=items.filter(x=>x.permission_to_quote&&x.quote_text).length;document.querySelector("#cards").innerHTML='<div class="stat"><span>Responses</span><b>'+items.length+'</b></div><div class="stat"><span>Average rating</span><b>'+avg+'/5</b></div><div class="stat"><span>Would pay £12.99</span><b>'+yes+'</b><small>'+maybe+' maybe</small></div><div class="stat"><span>Approved quotes</span><b>'+quotes+'</b></div>';document.querySelector("#applications").innerHTML=applications.length?applications.map(x=>'<div class="item"><div class="meta"><span>'+esc(x.created_at)+'</span><span>'+esc(x.mover_stage)+'</span><span>'+esc(x.move_date||"date not set")+'</span></div><h3>'+esc(x.name||"Anonymous")+'</h3><p>'+esc(x.email)+'</p></div>').join(""):'<p class="muted">No tester sign-ups yet.</p>';document.querySelector("#items").innerHTML=items.length?items.map(x=>'<div class="item"><div class="meta"><span>'+esc(x.created_at)+'</span><span>'+esc(x.mover_stage)+'</span><span>Rating '+esc(x.rating)+'/5</span><span>Pay: '+esc(x.would_pay||"—")+'</span></div><h3>'+esc(x.name||"Anonymous")+'</h3><p><b>Most useful:</b> '+esc(x.useful_text)+'</p>'+(x.confusing_text?'<div class="bad"><b>Confusing / missing:</b><br>'+esc(x.confusing_text)+'</div>':'')+(x.quote_text?'<div class="quote"><b>'+(x.permission_to_quote?'✅ Approved public quote':'Private quote — NOT approved for publication')+'</b><br>“'+esc(x.quote_text)+'”</div>':'')+'</div>').join(""):'<p class="muted">No feedback received yet.</p>'}
document.querySelector("#load").addEventListener("click",load);document.querySelector("#key").addEventListener("keydown",e=>{if(e.key==="Enter")load()});const saved=sessionStorage.getItem("hf90-feedback-key");if(saved){document.querySelector("#key").value=saved;load()}
</script></body></html>
