<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>HomeFirst90 Tester Feedback</title><link rel="icon" href="/icon.svg" type="image/svg+xml"><style>
:root{--g:#153f33;--m:#61706a;--p:#f5f5f0;--l:#dfe5e1;--ink:#17201d}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}.w{max-width:760px;margin:auto;padding:22px}.brand{font-size:22px;font-weight:950}.card{background:#fff;border:1px solid var(--l);border-radius:20px;padding:22px;margin-top:14px}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:850;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #c9d3ce;border-radius:11px;font:inherit}.field textarea{min-height:110px;resize:vertical}.btn{width:100%;border:0;background:var(--g);color:#fff;border-radius:12px;padding:14px;font-weight:900;font-size:16px;cursor:pointer}.muted{color:var(--m)}.msg{margin-top:10px;font-weight:800}.quote{background:#edf4f0;border-radius:14px;padding:14px}.check{display:flex;gap:9px;align-items:flex-start}.check input{margin-top:4px}@media(max-width:520px){.w{padding:12px}.card{padding:18px}}
</style></head><body><main class="w"><div class="brand">HomeFirst90</div><section class="card"><h1 style="margin-top:0">Founding Tester feedback</h1><p class="muted">Please be critical. We would rather fix something now than discover it after launch.</p><form id="f"><div class="field"><label>Your first name or initials (optional)</label><input id="name" maxlength="100"></div><div class="field"><label>Email (optional, only if you're happy for us to follow up)</label><input id="email" type="email"></div><div class="field"><label>Where are you in the moving journey?</label><select id="stage"><option value="planning">Planning a move</option><option value="moving_soon">Moving soon</option><option value="just_moved">Just moved</option><option value="testing_only">Testing the product rather than currently moving</option></select></div><div class="field"><label>Overall, how useful was HomeFirst90?</label><select id="rating"><option value="">Choose 1–5</option><option value="5">5 — Very useful</option><option value="4">4 — Useful</option><option value="3">3 — Some value</option><option value="2">2 — Not very useful</option><option value="1">1 — Not useful</option></select></div><div class="field"><label>What was most useful?</label><textarea id="useful" required></textarea></div><div class="field"><label>What was confusing, annoying or missing?</label><textarea id="confusing"></textarea></div><div class="field"><label>If you were genuinely moving, would £12.99 feel worth paying?</label><select id="pay"><option value="">Choose one</option><option value="yes">Yes</option><option value="maybe">Maybe / depends</option><option value="no">No</option></select></div><div class="field quote"><label>If you want, write one sentence that sums up HomeFirst90</label><textarea id="quote" maxlength="1000"></textarea><label class="check"><input id="permission" type="checkbox"><span>You may quote this sentence publicly as a genuine tester comment using the name/initials I supplied above. Leaving this unticked means the feedback stays private.</span></label></div><input id="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-10000px"><button class="btn" type="submit">Send feedback</button><div id="msg" class="msg"></div></form></section><p class="muted" style="font-size:12px"><a href="/privacy.html">Privacy</a> · Feedback is reviewed before anything is quoted publicly.</p></main><script>
const API="https://homefirst90-api.onrender.com";
document.querySelector("#f").addEventListener("submit",async e=>{e.preventDefault();const msg=document.querySelector("#msg");msg.textContent="Sending…";msg.style.color="#61706a";const body={name:document.querySelector("#name").value.trim(),email:document.querySelector("#email").value.trim(),mover_stage:document.querySelector("#stage").value,rating:+document.querySelector("#rating").value,useful_text:document.querySelector("#useful").value.trim(),confusing_text:document.querySelector("#confusing").value.trim(),would_pay:document.querySelector("#pay").value,quote_text:document.querySelector("#quote").value.trim(),permission_to_quote:document.querySelector("#permission").checked,website:document.querySelector("#website").value};try{const r=await fetch(API+"/api/feedback",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw new Error(d.error||"Could not send feedback.");msg.style.color="#153f33";msg.textContent="Thank you — feedback received ✓";document.querySelector("#f").querySelector("button").disabled=true}catch(err){msg.style.color="#8a2d1f";msg.textContent=err.message}});
</script><script src="/analytics.js" defer></script></body></html>
